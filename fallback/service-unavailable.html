<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Unavailable</title>

    <link rel="stylesheet" href="service-unavailable.css">
    <script src="service-unavailable.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<div class="card">
    <h1>Service temporarily unavailable</h1>
    <p id="message"></p>

    <div class="actions">
        <button class="primary" onclick="retry()">Retry</button>
        <button class="secondary" onclick="goHome()">Go Home</button>
    </div>
</div>

<div id="loader-modal" class="loader-modal hidden">
    <div class="loader-content">
        <div class="spinner"></div>
        <p>Connecting to service...</p>
    </div>
</div>
    
</body>
</html>
